# Standalone example for running the thumbnail-auth proxy on its own.
# If you're already running this plugin's config/script hosting alongside
# TubeArchivist in one compose stack (see this project's own deployment),
# just add the `grayjay-plugin` service + these two env vars to that
# existing stack instead of running this file separately.
#
# Usage:
#   cd proxy/
#   cp .env.example .env   # fill in your real TA_BASE_URL and TA_API_TOKEN
#   docker compose -f docker-compose.example.yml up -d
#
# Then point config.json's constants.thumbnailProxyBase at wherever this
# container ends up reachable, e.g. http://<host>:8080/thumb (or behind
# your own reverse proxy on a real domain with TLS — recommended, since
# GrayJay's Http package generally expects https:// URLs).

services:
  grayjay-thumbnail-proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - TA_BASE_URL=${TA_BASE_URL}
      - TA_API_TOKEN=${TA_API_TOKEN}
    volumes:
      - "./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro"
